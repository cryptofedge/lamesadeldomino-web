<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Gracias! — La Mesa del Dominó</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold: #d4af37;
    --gold-light: #f3dfa0;
    --black: #0a0a0c;
    --emerald-soft: #123b2c;
    --ivory: #f2ead9;
    --ivory-dim: #cfc6b2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px;
    background: radial-gradient(ellipse at 50% 20%, rgba(212,175,55,0.14), transparent 55%), radial-gradient(ellipse at 50% 100%, rgba(13,51,39,0.5), transparent 60%), var(--black);
    color: var(--ivory);
    font-family:'Inter', sans-serif;
  }
  .card{max-width: 480px;}
  img{width:120px; margin: 0 auto 24px; filter: drop-shadow(0 10px 24px rgba(212,175,55,0.25));}
  h1{font-family:'Cinzel', serif; color: var(--gold-light); font-size: 1.9rem; margin-bottom: 14px;}
  p{color: var(--ivory-dim); margin-bottom: 10px; line-height:1.6;}
  a.back{
    display:inline-block;
    margin-top: 22px;
    padding: 12px 26px;
    border-radius: 999px;
    border: 1px solid rgba(212,175,55,0.5);
    color: var(--gold-light);
    text-decoration:none;
    font-weight:600;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="assets/logo.png" alt="La Mesa del Dominó">
    <h1>¡Ya estás en la lista!</h1>
    <p>Gracias por reservar tu lugar en La Mesa del Dominó.</p>
    <p>Te avisaremos por correo en cuanto abramos el acceso anticipado — y no olvides tu insignia de <strong>Fundador</strong>.</p>
    <a class="back" href="/">Volver al sitio</a>
  </div>
</body>
</html>
